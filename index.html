<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>DevFest Accra 2026 Badge Generator</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link crossorigin="anonymous" href="https://fonts.googleapis.com/icon?family=Google+Sans:400&display=swap" rel="stylesheet" />
    <script type="module" src="./scripts/app.js"></script>
    <link rel="shortcut icon" href="./static/favicon1.png">
    <meta name="description" content="Generate your DevFest Accra 2026 profile badge directly in your browser">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <header>
      <img src="./images/logo.svg">
      DevFest Accra 2026 Badge Generator
    </header>
    <main>
      <div class="drop">
        <div class="drop-border">
          Drop your image here
        </div>
      </div>
      <aside>
        <div class="form">
          <div class="input">
            <label for="image">Profile Picture</label>
            <div class="file">
              <input id="image" type="file">
              <button type="button">Open Image</button>
            </div>
          </div>
          <div class="input">
            <label for="category">Frame Type</label>
            <select id="category">
              <option value="dark">Dark Frame</option>
              <option value="light">Light Frame</option>
            </select>
          </div>

          <div class="input" role="radiogroup" aria-labelledby="grid-label">
            <span id="grid-label" class="label">Grid</span>
            <div class="radio">
              <input name="grid" id="grid-none" value="none" type="radio" checked></input>
              <label for="grid-none">None</label>
              <input name="grid" id="grid-grid" value="grid" type="radio"></input>
              <label for="grid-grid">Grid</label>
            </div>
          </div>
          <div class="input">
            <label for="image-x">Image X Position</label>
            <div class="range">
              <input id="image-x" type="range" min="-100" max="100" value="0" step="0.1">
              <div>
                <span>0.0</span>
                <span>%</span>
              </div>
            </div>
          </div>
          <div class="input">
            <label for="image-y">Image Y Position</label>
            <div class="range">
              <input id="image-y" type="range" min="-100" max="100" value="0" step="0.1">
              <div>
                <span>0.0</span>
                <span>%</span>
              </div>
            </div>
          </div>
          <div class="input">
            <label for="image-z">Image Zoom Level</label>
            <div class="range">
              <input id="image-z" type="range" min="0.1" max="5" value="1" step="0.01">
              <div>
                <span>1.00</span>
                <span>x</span>
              </div>
            </div>
          </div>
          <div class="input">
            <button id="reset" type="button">Reset Position</button>
          </div>
        </div>
        <footer>
          <div>&copy; 2026 DevFest Accra. All rights reserved.</div>
        </footer>
      </aside>
      <content class="preview">
        <div class="canvas">
          <canvas></canvas>
        </div>
      </content>
      <button id="download" class="fab">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="#fff">
          <path d="M0 0h24v24H0V0z" fill="none"></path>
          <path d="M16.59 9H15V4c0-.55-.45-1-1-1h-4c-.55 0-1 .45-1 1v5H7.41c-.89 0-1.34 1.08-.71 1.71l4.59 4.59c.39.39 1.02.39 1.41 0l4.59-4.59c.63-.63.19-1.71-.7-1.71zM5 19c0 .55.45 1 1 1h12c.55 0 1-.45 1-1s-.45-1-1-1H6c-.55 0-1 .45-1 1z"></path>
        </svg>
        <span>Download</span>
      </button>
    </main>
  </body>
</html>
